[project]
name = "maritime-agent"
version = "0.1.0"
description = "Autonomous AI Agent and Neo4j Knowledge Graph system for maritime fleet intelligence, delay root-cause analysis, and cargo tracking via MCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.4",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-groq>=0.2.0",
    "langchain-openai>=1.7.3",
    "langchain-openrouter>=0.2.9",
    "langgraph>=0.2.0",
    "neo4j>=6.4.1",
    "openai>=3.42.1",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.4",
    "pytz>=2026.6",
    "pyyaml>=6.0",
    "tzdata>=2026.6",
]
